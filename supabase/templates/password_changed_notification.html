<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="supported-color-schemes" content="light" />
    <title>Senha alterada — Be Planned</title>
  </head>
  <body style="margin:0; padding:0; background-color:#f4f3f1; -webkit-text-size-adjust:100%; text-size-adjust:100%;">
    <div style="display:none; max-height:0; overflow:hidden; opacity:0;">
      A senha da sua conta Be Planned foi alterada agora há pouco.
    </div>

    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f4f3f1;">
      <tr>
        <td align="center" style="padding:40px 16px;">
          <table role="presentation" width="480" cellpadding="0" cellspacing="0" border="0" style="width:480px; max-width:100%; background-color:#ffffff; border-radius:20px; box-shadow:0 16px 40px -12px rgba(20,21,26,0.18);">
            <tr>
              <td style="padding:40px 40px 8px 40px;" align="center">
                <img
                  src="https://beplanned.com.br/BePlanned%20Logo.png"
                  width="160"
                  alt="Be Planned"
                  style="display:block; width:160px; max-width:160px; height:auto; border:0;"
                />
              </td>
            </tr>
            <tr>
              <td style="padding:24px 40px 0 40px;" align="center">
                <p style="margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:19px; line-height:1.3; font-weight:700; color:#14151a;">
                  Sua senha foi alterada
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding:14px 40px 0 40px;" align="center">
                <p style="margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:14px; line-height:1.6; color:#6c7280;">
                  A senha da sua conta Be Planned foi alterada agora há pouco.
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding:28px 40px 8px 40px;" align="center">
                <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                  <tr>
                    <td align="center" bgcolor="#2e7d32" style="border-radius:999px;">
                      <a
                        href="{{ .SiteURL }}/esqueci-senha"
                        target="_blank"
                        style="display:inline-block; padding:13px 32px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:14px; font-weight:700; color:#ffffff; text-decoration:none; border-radius:999px;"
                      >
                        Não fui eu — redefinir senha
                      </a>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding:16px 40px 0 40px;" align="center">
                <p style="margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:12px; line-height:1.6; color:#9198a3;">
                  Se foi você, pode ignorar este e-mail com segurança.
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding:28px 40px 0 40px;">
                <div style="height:1px; background-color:rgba(20,21,26,0.08); line-height:1px; font-size:1px;">&nbsp;</div>
              </td>
            </tr>
            <tr>
              <td style="padding:20px 40px 36px 40px;" align="center">
                <p style="margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:11.5px; line-height:1.6; color:#9198a3;">
                  Be Planned · Asset Retirement Obligation<br />
                  <a href="https://beplanned.com.br/privacidade" style="color:#9198a3; text-decoration:underline;">Política de Privacidade</a>
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>

<!doctype html>
<html lang="pt-BR" style="background-color: #f4f3f1">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="Be Planned — simulação financeira pra provisionamento de fechamento de mina." />
    <title>Be Planned — Simulação financeira de fechamento de mina</title>

    <!-- Open Graph / Twitter Card — preview de link compartilhado (WhatsApp, e-mail, Slack).
         noindex/nofollow acima é deliberado (app B2B logado, sem indexação de busca) —
         isso não afeta o preview de link, que é lido direto pelo bot do app de mensagem,
         não por um crawler de busca. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Be Planned" />
    <meta property="og:title" content="Be Planned — Simulação financeira de fechamento de mina" />
    <meta property="og:description" content="Framework de simulação financeira pra provisionamento de fechamento de mina — dashboard, gestão de projetos e portal do cliente." />
    <meta property="og:image" content="https://beplanned.com.br/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://beplanned.com.br" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Be Planned — Simulação financeira de fechamento de mina" />
    <meta name="twitter:description" content="Framework de simulação financeira pra provisionamento de fechamento de mina." />
    <meta name="twitter:image" content="https://beplanned.com.br/og-image.jpg" />
    <link rel="preload" as="image" href="/PADRONAGEM%20-%20FUNDO%20com%20pontilhado.png" fetchpriority="high" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Aplica o tema salvo antes do bundle Vite carregar — evita FOUC de
      // tema errado (dark visto momentaneamente em light e vice-versa).
      // TemaContext.bootstrapTemaFromCache faz o mesmo, mas roda só quando
      // o módulo é parseado; este roda no parse do HTML.
      try {
        if (localStorage.getItem('aro-tema') === 'dark') document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
    <style>
      html,
      body {
        background-color: #f4f3f1;
      }
      html.dark,
      html.dark body {
        background-color: #0d1013;
      }
      .bg-fixed {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        background:
          linear-gradient(rgba(244, 243, 241, 0.92), rgba(244, 243, 241, 0.92)),
          url('/PADRONAGEM%20-%20FUNDO%20com%20pontilhado.png') center / cover no-repeat;
      }
      html.dark .bg-fixed {
        background:
          linear-gradient(rgba(13, 16, 19, 0.92), rgba(13, 16, 19, 0.92)),
          url('/PADRONAGEM%20-%20FUNDO%20com%20pontilhado.png') center / cover no-repeat;
      }
      #root {
        position: relative;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div class="bg-fixed" aria-hidden="true"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
